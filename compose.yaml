name: deltafit-i0
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: deltafit
      POSTGRES_DB: deltafit_dev
      POSTGRES_PASSWORD: ${DELTAFIT_DB_PASSWORD:?Execute scripts/local.ps1 init}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["dev-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltafit -d deltafit_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  integration-db:
    profiles: ["tests"]
    image: postgres:18.6
    environment:
      POSTGRES_USER: deltafit
      POSTGRES_DB: deltafit_integration_disposable
      POSTGRES_PASSWORD: ${DELTAFIT_DB_PASSWORD:?Execute scripts/local.ps1 init}
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltafit -d deltafit_integration_disposable"]
      interval: 2s
      timeout: 3s
      retries: 30
  e2e-db:
    profiles: ["tests"]
    image: postgres:18.6
    environment:
      POSTGRES_USER: deltafit
      POSTGRES_DB: deltafit_e2e_disposable
      POSTGRES_PASSWORD: ${DELTAFIT_DB_PASSWORD:?Execute scripts/local.ps1 init}
    ports: ["127.0.0.1:55434:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltafit -d deltafit_e2e_disposable"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev-data:
